name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        # CPU-only torch first, so the `ml` extra doesn't pull ~2 GB of CUDA wheels.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ml,api,dashboard,dev]"
      - name: Lint
        run: ruff check src tests
      - name: Generate synthetic data
        run: python -m privguard.synthetic
      - name: Test
        run: pytest --cov=privguard --cov-report=term-missing --cov-fail-under=70

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build image (generates data + trains the scorer; no push)
        run: docker build -t privguard:ci .
