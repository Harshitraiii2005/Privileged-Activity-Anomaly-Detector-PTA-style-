[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privguard"
version = "0.1.0"
description = "ML-based privileged-activity anomaly detection, inspired by CyberArk PTA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "shap>=0.46",
    "joblib>=1.3",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "matplotlib>=3.8"]          # autoencoder + evaluation plots (not needed to serve)
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
dashboard = ["streamlit>=1.35", "httpx>=0.27"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pinned so a new ruff release can't change what CI enforces.
select = ["E4", "E7", "E9", "F", "B", "C4"]
ignore = ["B905"]  # zip(strict=): every zip here pairs columns of the same frame
